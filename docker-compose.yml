version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: garambazaar_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - garambazaar_net

  redis:
    image: redis:7-alpine
    container_name: garambazaar_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - garambazaar_net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: garambazaar_server
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - MONGODB_URI=mongodb://mongodb:27017/GaramBazaar
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-enterprise_production_jwt_access_secret_key_32_chars}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-enterprise_production_jwt_refresh_secret_key_32_chars}
      - CLIENT_URL=${CLIENT_URL:-http://localhost}
      - BCRYPT_SALT_ROUNDS=10
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_placeholder}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-rzp_secret_placeholder}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-rzp_webhook_secret_placeholder}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - garambazaar_net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: garambazaar_client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - garambazaar_net

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local

networks:
  garambazaar_net:
    driver: bridge
